<script id="ng-state" type="application/json">{"370037739":{"b":{"id_conteudo_pk":18,"titulo":"Sem titulo","autor":"Anonimo","ano":"Nao informado","categoria":"Fotografias","assunto":"Sem assunto","arquivo":"Fotografia_18.jpg","WCAG":[{"WCAG_id":18}],"conteudo":"A imagem mostra um palco preparado para um evento formal chamado “APL – Arranjo Produtivo Local – Bonés Apucarana”. À frente há uma mesa longa coberta por uma toalha branca que chega até o chão, com cadeiras também revestidas de branco. No centro da mesa há um arranjo de flores amarelas e brancas com folhagem verde. Ao fundo, ocupando toda a largura do palco, há um grande painel branco com várias logomarcas de empresas, associações, bancos e instituições públicas. Na parte superior do painel está escrito, em letras grandes, o título do evento. No centro do painel há uma imagem oval de dois homens remando um barco, acompanhada da frase “Venha ocupar o seu lugar. Juntos iremos mais longe...”. Em frente a essa imagem há um púlpito com um microfone, indicando que o local está preparado para discursos. A iluminação é clara e uniforme, e não há pessoas presentes no momento da foto, apenas a estrutura organizada para a cerimônia."},"h":{},"s":200,"st":"OK","u":"https://raw.githubusercontent.com/IF-DeividSilva/acervo-ecomuseu/main/Metadados/metadados_conteudos/conteudo_18.json","rt":"json"},"1568387021":{"b":{"documentos":[{"id_pk":1,"id_conteudo":2},{"id_pk":2,"id_conteudo":7},{"id_pk":3,"id_conteudo":18},{"id_pk":4,"id_conteudo":25},{"id_pk":5,"id_conteudo":73},{"id_pk":6,"id_conteudo":256}]},"h":{},"s":200,"st":"OK","u":"https://raw.githubusercontent.com/IF-DeividSilva/acervo-ecomuseu/main/Metadados/metadados_principal.json","rt":"json"},"1924086863":{"b":{"id_conteudo_pk":25,"titulo":"Sem titulo","autor":"Anonimo","ano":"Nao informado","categoria":"Fotografias","assunto":"Sem assunto","arquivo":"Fotografia_25.jpg","WCAG":[{"WCAG_id":18}],"conteudo":"Foto em close-up (primeiro plano) de perfil da palestrante. A mulher tem pele clara, cabelos curtos escuros e usa brincos dourados. Ela aparece do tronco para cima, de perfil para a esquerda, com a boca levemente aberta como se estivesse falando. O fundo é desfocado em tons de azul e branco."},"h":{},"s":200,"st":"OK","u":"https://raw.githubusercontent.com/IF-DeividSilva/acervo-ecomuseu/main/Metadados/metadados_conteudos/conteudo_25.json","rt":"json"},"2286095766":{"b":{"id_conteudo_pk":73,"titulo":"Dia do Boné Movimenta Comunidade em Apucarana","autor":"Tribuna do Norte","ano":"2007","categoria":"Noticias","assunto":"Comemoração do Dia do Boné","arquivo":"Noticia_73.jpg","WCAG":[18,16,17],"conteudo":"10 QUINTA-FEIRA, 01 de fevereiro de 2007 TRIBUNA DO NORTE\nCIDADES\n\nDia do Boné movimenta comunidade em Apucarana\n\nAções valorizando o produto feito no município e estimulando o seu uso no dia-a-dia mexeram com a cabeça da população durante todo o dia ontem\n\nTAÍS MARIANO\nDE APUCARANA\n\nA data de ontem ficou marcada em Apucarana pela comemoração oficial do \"Dia do Boné\", incluído no calendário de eventos da cidade através da lei municipal. Para fazer parte da programação, o Serviço Social da Indústria (Sesi), Serviço Social do Comércio (Sesc), Serviço Nacional de Aprendizagem Industrial (Senai) e Serviço Brasileiro de Apoio às Micro e Pequenas Empresas (Sebrae) promoveram atividades na Praça Rui Barbosa envolvendo cultura, saúde e lazer como recreação infantil, orientação de higiene bucal, aferição da pressão arterial, testes de glicemia e acuidade visual. As ações foram realizadas em conjunto também com o Arranjo Produtivo Local (APL), Associação das Indústrias de Bonés e Brindes de Apucarana (Assibbra), Associação Nacional das Indústrias de Bonés e Brindes (Anibb), Associação Brasileira dos Fabricantes de Bonés de Qualidade (Abrafabq) e Prefeitura de Apucarana.\n\nNo final da tarde, a estrutura metálica do boné gigante foi levada até o Parque Industrial Norte, na saída para Arapongas, onde será concretada para se transformar no monumento do boné. A instalação do marco próximo ao Contorno Norte se tornará ponto turístico da cidade. O dia foi encerrado com o show da dupla Caio & João Victor e banda no platô da Praça.\n\nSegundo Edimara Pedretti Garcia, funcionária do Sesi, aproximadamente 800 pessoas realizaram os exames de saúde e outros oferecidos. \"Durante todo o dia, foi bem movimentado e acho muito importante essa comemoração\", diz Edimara. Para o funcionário público Eder Rossetti, a iniciativa das associações foi positiva e devia acontecer anualmente. \"Para o show mais tarde, eu e meus amigos alugamos uma Van para prestigiar o evento\", diz.\n\nDe acordo com a APL, mais de 15 mil bonés comemorativos foram distribuídos gratuitamente, fazendo a cabeça da população.\n\nVOCAÇÃO ECONÔMICA\nPopulação de Apucarana lembra o Dia do Boné com diversas atividades durante todo o dia. Município quer que seu principal produto seja mais divulgado, valorizado e usado pelas pessoas.\n\nProduto merece ser reconhecido\nO objetivo do Dia do Boné, em Apucarana, é valorizar e estimular o seu uso. Alguns comerciantes da área central atenderam seus clientes de boné, como é o caso de Nerival Luiz Prestes, da Livraria Nerimar, na Praça Rui Barbosa. \"Distribuí bonés para funcionários e gerência, que usaram o dia todo. Acho que devemos valorizar aquilo que a cidade produz\", garante. Motoristas e cobradores de ônibus, funcionários do Hospital da Providência e da Caixa Econômica também usaram. Agnaldo Reis, presidente da Associação das Indústrias de Bonés e Brindes de Apucarana (Assibbra), festeja a data. \"Este dia demorou para ser reconhecido, mas enfim chegou. Afinal representa 57% da mão-de-obra de Apucarana e nada mais justo que o boné seja reconhecido\", diz. (TM)\n\nLegendas:\nNAS LOJAS, funcionários trabalharam durante o dia com boné na cabeça: valorização de um dos principais produtos do município.\nDIVERSAS ATIVIDADES foram realizadas na Praça Rui Barbosa para lembrar o Dia do Boné, entre as quais aferição da pressão arterial."},"h":{},"s":200,"st":"OK","u":"https://raw.githubusercontent.com/IF-DeividSilva/acervo-ecomuseu/main/Metadados/metadados_conteudos/conteudo_73.json","rt":"json"},"2905133575":{"b":{"id_conteudo_pk":256,"titulo":"Ecomuseu do Bone","autor":"Projeto Ecomuseu do Bone","ano":"2025","categoria":"Publicidades","assunto":"Sem assunto","arquivo":"Publicidade_256.MP4","WCAG":[{"WCAG_id":1}],"conteudo":"Video em animacao grafica vertical com fundo creme suave. No inicio, um pequeno ponto verde-azulado surge na lateral esquerda e desliza para o centro, transformando-se no titulo em letras maiusculas e em negrito: ECOMUSEU DO BONE. O titulo desaparece suavemente e da lugar a uma lista de cinco conceitos que surgem em sequencia, alinhados a esquerda, na mesma cor do titulo mas em tom mais claro. As palavras sao: Memoria; Comunidade; Identidade cultural; Informacao; Coletividade. A lista se apaga e surge centralizada a logomarca do projeto, formada por um circulo de traco fino verde-azulado. Dentro do circulo ha um desenho minimalista e estilizado de um bone de perfil. Acompanhando a curvatura interna do circulo esta escrito ECOMUSEU na parte superior e BONE na parte inferior. Logo abaixo da logomarca aparece um pequeno retangulo arredondado contendo o icone colorido do Instagram e o nome de usuario: ecomuseudobone. O video termina com a logo e o contato fixos na tela."},"h":{},"s":200,"st":"OK","u":"https://raw.githubusercontent.com/IF-DeividSilva/acervo-ecomuseu/main/Metadados/metadados_conteudos/conteudo_256.json","rt":"json"},"2918491208":{"b":{"id_conteudo_pk":2,"titulo":"Contextualizacao e caracterização do arranjo produtivo local de bonés de Apucarana-Paraná","autor":"Anonimo","ano":"Nao informado","categoria":"Artigos","assunto":"História da industria de bonés na cidade de Apucarana","arquivo":"Artigo_2.pdf","WCAG":[{"WCAG_id":[16,17]}],"conteudo":" Plano de Desenvolvimento do APL de Bones de Apucarana - Paraná 1. CONTEXTUALIZAÇÃO E CARACTERIZAÇÃO DO ARRANJO PRODUTIVO LOCAL DE BONÉS DE APUCARANA – PARANÁ 1.1 Histórico da Formação do APL Em 1974 teve início a fabricação de bonés em Apucarana-PR, a partir da produção artesanal de bandanas e tiaras que eram comercializadas em feiras agropecuárias, exposições e nas praias do litoral paranaense. De inicio, os empresários pioneiros na fabricação de bonés limitavam-se a copiar e produzir bonés com aba de papelão, reguladores de elástico e fazendo uso da técnica de silk screen. No início da década de 1980, começaram a surgir as primeiras empresas do segmento, entre elas a Faroli, a Cotton's, a Sementec e a Kep's. O sucesso desses empreendimentos familiares foi tamanho que à medida que o mercado interno se expandia, surgiam novos empreendimentos em um processo de spin-lover. Contudo, não havia na região os elos da cadeia produtiva de bonés e confecções. A dublagem de tecidos era realizada em São Paulo, assim como a aquisição da matéria-prima e das máquinas e equipamentos. Em 1986 surgiram na região as primeiras empresas da cadeia produtiva de bonés, entre elas a Dalplast, Showa e outras. Os empresários do setor de bonés reuniram-se em torno de um objetivo comum: melhorar a qualidade e a produtividade das empresas do segmento. Contrataram consultoria especializada nas áreas de qualidade, processo produtivo, formação do preço e controle de custos. Dividiram a produção em células e deram início ao processo de capacitação das costureiras do setor com o apoio do Senai Apucarana. Através da cooperação, as empresas conseguiram melhorar a qualidade e a produtividade da indústria de bonés. Surgiram os primeiros contratos promocionais em nível nacional e internacional. Entre eles, cita-se o da Cofap, o da Arisco e de franquias de filmes mundiais como o Jurassic Park. Contudo, o fato marcante na formação do arranjo de bonés foi a celebração do contrato com o Banco Nacional. Através desse contrato, o piloto Ayrton Senna tornou-se o primeiro garoto propaganda do setor, o que contribuiu para a projeção da indústria de bonés de Apucarana na mídia nacional. No início da década de 1990, a partir da expansão da demanda nacional de bonés promocionais, houve um crescimento desordenado do número de empresas do setor. Nesta fase, as empresas engajaram-se numa competição via preços o que, em última instância, afetou a rentabilidade e a lucratividade, na razão direta do crescimento da concorrência interna. A estratégia de diferenciação utilizada pelas empresas foi buscar agregar valor ao boné, com a finalidade de manter e/ou ampliar o market share. Entre 1994 e 1996 dois fatos importantes marcaram a mudança de paradigma na fabricação de bonés em Apucarana: a importação de máquinas de bordado computadorizado e o surgimento na região de empresas distribuidoras de matérias-primas (e.g., Dalplast, Dicatex, Boneon, Paranatex e Conviex) e fornecedores de máquinas e equipamentos, tais como: Taicry e M.A.B. Fortuna, entre outras. Teve início uma nova geração de bonés: a indústria de bonés bordados, com maior valor agregado e diferencial competitivo. As empresas do segmento investiram pesadamente em Marketing e Apucarana conquistou um espaço importante na mídia televisiva, sendo conhecida como a 'Capital do Boné', em referência à produção de um dos brindes mais utilizados pelas empresas no país. A partir do ano 1997, o escritório regional do Sebrae em Apucarana vem desenvolvendo ações de articulação, estimulando a cooperação, interação e aprendizagem. A primeira iniciativa foi a constituição, com 13 empresas, da Associação Brasileira dos Fabricantes de Bonés de Qualidade (ABRAFAB'Q), onde foi elaborado e realizado um projeto de exportação com o apoio da APEX; certificação ISO 9000 e central de compras. O passo seguinte foi a constituição da Associação das Indústrias de Bonés e Brindes de Apucarana (ASSIBBRA), formada por 17 empresas. Um dos principais objetivos da ASSIBBRA foi operacionalizar uma central de compras; formar estoques reguladores e produzir, de forma conjunta, os insumos para a montagem de bonés. Contudo, não havia na região mão-de-obra qualificada para atender às necessidades de expansão do setor de bonés. Assim, a ACIA - Associação Comercial, Industrial e de Serviços de Apucarana (ACIA), em um esforço conjunto que envolveu os empresários do setor e a Prefeitura de Apucarana, iniciou um processo de negociação junto ao ministério da Educação/PROEP para implantar na região um centro de formação e treinamento de mão-de-obra nas áreas têxtil e de confecções. Como resultado dessas iniciativas, foi implantado no município de Apucarana o Centro Moda: uma escola técnica para formação e capacitação de profissionais para a indústria do vestuário e moda, que tem como missão \"Formar, capacitar e requalificar profissionais necessários ao atendimento do setor da indústria do vestuário da região\". Em 2003, com o apoio do Sebrae/PR e entidades locais, o municipio de Apucarana passou a implantar o modelo de APL. No início de 2004 formou-se o comitê gestor do APL de bonés de Apucarana, com a participação de empresários e entidades parceiras. Em junho de 2004 foi realizada uma Oficina de Planejamento com o propósito de elaborar o Plano Estratégico para o Desenvolvimento do Setor de Bonés do município, no âmbito de atuação do Sebrae-PR, seguindo a metodologia dos Arranjos Produtivos Locais. Obteve-se como resultado da Oficina tem-se um conjunto de ações que deverão nortear não apenas as atividades inovadoras, mas também as atividades relacionadas à qualidade e à sustentabilidade do Setor. De acordo com o Sebrae/PR, Apucarana é um dos grandes pólos ra confecção de bonés e produtos associados (bandanas, bolsas, porta CD's e camisetas), com uma produção mensal em torno de quatro milhões de peças mês, o que representa mais da metade da produção nacional do setor. Os elos da cadeia produtiva estão presentes em Apucarana, que hoje encontra no mercado local a matéria-prima e o maquinário necessários à produção do boné."},"h":{},"s":200,"st":"OK","u":"https://raw.githubusercontent.com/IF-DeividSilva/acervo-ecomuseu/main/Metadados/metadados_conteudos/conteudo_2.json","rt":"json"},"3042608291":{"b":{"id_conteudo_pk":7,"titulo":"Sem titulo","autor":"Antonio Carlos Macarrao Machado","ano":"Nao informado","categoria":"Depoimentos","assunto":"Relato de Antonio Carlos Macarrao sobre o pioneirismo da Cotton's e a história do boné em Apucarana.","arquivo":"Depoimento_7.pdf","WCAG":[{"WCAG_id":[16,17]}],"conteudo":"1 - Quem trouxe a primeira maquina de bordar p Apucarana, foi eu atraves de uma importação direta da Melco Americana! A primeira bordadeira de Apucarana, foi uma Melco de 8 cabeças, q montava de 4 em 4! Eu cuidava tambem do dpto importação e exportação era formado em Marketing e Com.Exterior, e uma vez na Argentina vi uma maquina, menor de 2 cabeças e convenci o Jaime de comprar, pq achava q aquele tipo de trabalho ia dar difencial ao nosso bone! Trouxe nossa maquina, atraves de carta de credito do Banestado, q neste tempo, o prazo maximo p operação era 30 dias! (acho q tenho docs desta operação)Consegui uma de prazo 180 dias, coisa quase impossivel a Epoca! Tenho matérias em jornais relatando a aquisição festejada da empresa. 2-A segunda bordadeira, eu tambem trouxe, e ai ja foi uma japonesa uma Tajima 12 cabeças!! 3-A Cottons foi pioneira, na aquisição de uma maquina de dublar Foi em 1987 uma máquina rotativa (Alemanha)de estampar e também para dublagem de tecidos ! Ate hoje aquela maquina é mais moderna q as q estao ai na cidade! 4-Acho que é justo e se nescessario, dizer q a Cottons foi a maior empresa de bones da AL, e as feiras nacionais e internacionais q fizemos ao longo dos anos, os pedidos de 1 milhao de bones da copa do mundo, Formula 1, etc, serviram p alavancar e chamou a atenção p o setor!! 5-Outra coisa q acredito q deva ser mencionado porque é justo, e se, é para falar sobre a verdadeira historia, do bone, teremos q falar da campanha Apucarana Capital do Bone, que se iniciou nos primordios,! Foi criada pelo Paulo Gabardo e por mim! Nos dois iniciamos sozinhos com muita garra a nossa estrategia. Divulgavamos, em feiras, eventos dos mais diversos setores! Mesmo nao tendo muito apoio dos proprios fabricantes da época! Digo isso nao pq queremos reconhecimento, mas q justiça seja feita por algo q nos acreditamos lá traz e poucos deram valor e q hoje tem sua indentidade que beneficia a cidade e o setor! Sei muito bem que muitos sr beneficiam ate hoje!! 6-A novela ti ti ti, que houve aquela parceria, com algumas empresas, q a meu ver nao teve o retorno esperado e investido, p o setor, e q sabemos a dor de cabeça q virou depois na justiça envolvendo prefeitura etc, nao foi a de1985!! Foi na reedição da novela de 2010. So um comentario neutro! A fala sobre a Abigail e empresa dela, achei q ficou redundante! Tem mais enfase q a historia sobre as empresas de bones! Adoro a Biga, mas se hoje Apucarana é o q é!! Deve se ao JAIME a Cottons, e a outros do inicio, mas a Corttons, foi alem do tempo, foi pioneira em todas tecnologias possiveis! Desde maquinas, materias primas, modelagem, etc! Passando por processos modernos de produção! Depois temos outras empresas antigas, como showa, keeps, Kicker, etc Achei muito simplista sobre as verdadeiras alavancadoras do setor! A Abigail é uma grande empresaria, importante p o setor da confecção, mas especificamente po bone, a historia tem outros protagonistas! E a leva q vem com vcs Milano, Krisuil, Bonelli, Bunnet, Kiooday etc! Que sao os que na sequencia com otima administração e modernidade continuam com chave de ouro, uma historia q ainda é adolescente perante o q vem pela frente, e promete mais captulos de prosperidade! Minha humilde opinião! Antonio Carlos Macarrão Machado"},"h":{},"s":200,"st":"OK","u":"https://raw.githubusercontent.com/IF-DeividSilva/acervo-ecomuseu/main/Metadados/metadados_conteudos/conteudo_7.json","rt":"json"},"__nghData__":[{},{"t":{"1":"t0","2":"t1","3":"t2","4":"t3","5"
