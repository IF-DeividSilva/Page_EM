<!-- WCAG 5: <button> nativo garante semântica sem role extra -->
<!-- WCAG 6: aria-label muda dinamicamente descrevendo a ação atual -->
<!-- WCAG 7: área mínima de 44x44px garantida via CSS -->

<div role="group" [attr.aria-label]="tipo === 'video' ? 'Reprodução do vídeo' : 'Reprodução do áudio'">
  <button type="button"
          class="btn waves-effect waves-light"
          [attr.aria-label]="reproduzindo ? 'Pausar ' + tipo : 'Reproduzir ' + tipo"
          (click)="toggleReproducao()">
    <i class="material-icons" aria-hidden="true">
      {{ reproduzindo ? 'pause' : 'play_arrow' }}
    </i>
  </button>
</div>
