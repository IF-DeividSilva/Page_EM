<h2>{{conteudoDetalhado.titulo}}</h2>
<body> 
    <div class="conteudo-d">
        <p>Autor: {{conteudoDetalhado.autor}}</p>
        <p>Ano: {{conteudoDetalhado.ano}}</p>
        <p>Assunto: {{conteudoDetalhado.assunto}}</p>
        <p>Conteúdo: {{conteudoDetalhado.conteudo}}</p>

        <button class="btn waves-effect waves-light" aria-label="Reproduzir áudio" [attr.aria-pressed]="reproduzindo" (click)="toggleReproducao()">
            <i class="material-icons play_arrow">play_arrow</i>
        </button>
        
    </div>
</body>
