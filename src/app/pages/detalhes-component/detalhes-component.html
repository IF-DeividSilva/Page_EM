<main *ngIf="conteudoDetalhado"> 
    
    <h1 #tituloItem tabindex="-1" style="outline: none;">
        {{ conteudoDetalhado.titulo || 'Detalhes do Conteúdo' }}
    </h1>

    <div #conteudoRef class="conteudo-d">
        <app-accessibility 
            [idConteudo]="conteudoDetalhado.id_conteudo_pk"
            [elementoAlvo]="conteudoRef"
            [conteudo]="conteudoDetalhado">
        </app-accessibility>

        <button type="button" 
                class="btn waves-effect waves-light"
                aria-label="{{ reproduzindo ? 'Pausar áudio' : 'Reproduzir áudio' }}"
                (click)="toggleReproducao()">
            <i class="material-icons" aria-hidden="true">
                {{ reproduzindo ? 'pause' : 'play_arrow' }}
            </i>
        </button>
    </div>

    <div class="midia-container" *ngIf="conteudoDetalhado.arquivo" role="region" aria-label="Mídia do conteúdo">
        
        <div *ngIf="isImagem()" class="midia-wrapper">
            <img [src]="obterUrlArquivo()" [alt]="conteudoDetalhado.titulo" class="midia-img">
        </div>
        
        <div *ngIf="isPDF()" class="midia-wrapper">
            <iframe [src]="obterUrlPDFViewer()" class="midia-pdf" aria-hidden="true" tabindex="-1"></iframe>
        </div>
        
        <div *ngIf="isVideo()" class="midia-wrapper">
            <video #videoElement 
                   class="midia-video" 
                   aria-label="Reprodutor de vídeo"
                   (play)="reproduzindoVideo = true"
                   (pause)="reproduzindoVideo = false"
                   (ended)="reproduzindoVideo = false">
                <source [src]="obterUrlArquivo()" type="video/mp4">
                Seu navegador não suporta vídeo.
            </video>
            
            <div class="video-controls" role="region" aria-label="Controles do vídeo">
                <button type="button" 
                        class="btn waves-effect waves-light"
                        aria-label="{{ reproduzindoVideo ? 'Pausar vídeo' : 'Reproduzir vídeo' }}"
                        (click)="toggleReproducaoVideo()">
                    <i class="material-icons" aria-hidden="true">
                        {{ reproduzindoVideo ? 'pause' : 'play_arrow' }}
                    </i>
                </button>
                
                <div class="volume-control">
                    <i class="material-icons" aria-hidden="true">volume_up</i>
                    <input type="range" 
                           min="0" 
                           max="1" 
                           step="0.1" 
                           [value]="volumeVideo" 
                           (change)="atualizarVolumeVideo($any($event.target).value)"
                           aria-label="Controle de volume do vídeo">
                </div>
                
                <button type="button" 
                        class="btn waves-effect waves-light"
                        aria-label="Tela cheia"
                        (click)="toggleFullscreen()">
                    <i class="material-icons" aria-hidden="true">fullscreen</i>
                </button>
            </div>
        </div>
    </div>
</main>
