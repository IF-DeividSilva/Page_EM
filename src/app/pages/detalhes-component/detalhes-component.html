<h1>Detalhes do Conteúdo</h1>

<main *ngIf="conteudoDetalhado"> 
    <div #conteudoRef class="conteudo-d">
        <app-accessibility 
            [idConteudo]="conteudoDetalhado.id_conteudo_pk"
            [elementoAlvo]="conteudoRef"
            [conteudo]="conteudoDetalhado">
        </app-accessibility>

        <button type="button" 
                class="btn waves-effect waves-light"
                aria-label="{{ reproduzindo ? 'Pausar áudio' : 'Reproduzir áudio' }}"
                (click)="toggleReproducao()">
            <i class="material-icons" aria-hidden="true">{{ reproduzindo ? 'pause' : 'play_arrow' }}</i>
        </button>
    </div>
</main>

<div class="midia-container" *ngIf="conteudoDetalhado?.arquivo" role="region" aria-label="Seção de mídia do conteúdo na integra">
    <div *ngIf="isImagem()" class="midia-wrapper" role="img" [attr.aria-label]="conteudoDetalhado.titulo">
        <img [src]="obterUrlArquivo()" [alt]="conteudoDetalhado.titulo" class="midia-img">
    </div>
    
    <div *ngIf="isPDF()" class="midia-wrapper">
        <iframe [src]="obterUrlPDFViewer()" class="midia-pdf" role="document" aria-label="Visualizador de PDF"></iframe>
    </div>
    
    <div *ngIf="isVideo()" class="midia-wrapper">
        <video controls class="midia-video" role="video" aria-label="Reprodutor de vídeo">
            <source [src]="obterUrlArquivo()" type="video/mp4">
            Seu navegador não suporta vídeo.
        </video>
    </div>
</div>
